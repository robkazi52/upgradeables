  "mechanism": "Rank active regions by relevance to the locked task and expected decision impact, choose a bounded focus corridor, suppress unrelated material from the live workspace without deleting it, and periodically test whether excluded regions now contain material counterevidence. The recovered Neuro-Focus purpose and its Anti-Tunnel Vision caution support this normalized control; it is not a neurological claim.",
  "procedure": [
    "Lock the question and define what evidence would make a region high value.",
    "Score or order candidate regions by relevance, uncertainty reduction, and consequence.",
    "Activate the smallest region sufficient for deep work and retain pointers to excluded regions.",
    "Perform the focused analysis or repair.",
    "At checkpoints, invoke an alternative scan or Anti-Tunnel Vision test.",
    "Expand, shift, or release focus when new evidence changes priority."
  ],
  "always_do": [
    "Make the focus target and exclusion boundary explicit.",
    "Keep excluded material recoverable.",
    "Use an anti-fixation checkpoint when alternatives could change the result."
  ],
  "never_do": [
    "Do not equate focus with truth or authority.",
    "Do not permanently discard out-of-focus evidence.",
    "Do not claim biological or hidden-attention manipulation."
  ],
  "interaction_reasons": {
    "activation-budget-funnel": "ABF limits concurrent pulls; Neuro-Focus ranks and deepens the most valuable pull or region.",
    "anti-tunnel-vision": "Tests a focused path against credible alternatives before commitment."
  },
  "counterbalance_reasons": {
    "anti-tunnel-vision": "Prevents deliberate narrowing from becoming fixation or evidence blindness."
  },
  "redundancy_reasons": {
    "scoped-loader": "Loader chooses relevant modules; Neuro-Focus allocates depth among already relevant regions.",
    "working-memory-lock-in": "Locks critical items in active state; Neuro-Focus directs processing toward a selected region."
  },
  "conflict_rules": [
    "Source coverage and truth gates override the desire to stay narrowly focused.",
    "If the focus target was selected from incomplete evidence, preserve provisional status and run an alternative scan."
