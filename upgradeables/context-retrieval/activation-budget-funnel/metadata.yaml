  "mechanism_basis": "recovered",
  "mechanism": "Admit only a bounded set of live source or module pulls, historically roughly five to seven, and move each through a fixed funnel: retrieve, quote or capture, index verified atoms, transform those atoms, write from the index, then verify against sources. Retire raw pulls from active attention after their durable evidence is indexed so retrieval and decision-making do not compete in one step.",
  "procedure": [
    "Define the question and the evidence fields the task needs.",
    "Queue candidate sources or modules rather than activating all of them.",
    "Retrieve a bounded batch, keeping roughly no more than five to seven active pulls when that heuristic fits the host.",
    "Capture source-grounded quotes or facts with provenance.",
    "Index verified atoms into compact state and release unneeded raw context.",
    "Transform and synthesize from indexed evidence only after capture is complete for the batch.",
    "Write the result, then verify material claims back against the source pointers."
  ],
  "always_do": [
    "Separate retrieval/capture from synthesis.",
    "Preserve provenance when compressing a source into indexed state.",
    "Treat five-to-seven as an architectural heuristic, not a measured universal limit."
  ],
  "never_do": [
    "Do not summarize unsupported material into the evidence index.",
    "Do not keep adding raw pulls while simultaneously committing a decision.",
    "Do not discard a source pointer needed for later verification."
  ],
  "interaction_reasons": {
    "scoped-loader": "Chooses which sources/modules may enter the funnel and in what authority order.",
    "neuro-focus": "Concentrates work on the highest-value active batch after ABF limits concurrent pulls.",
    "stateblock": "Stores verified indexed atoms and their provenance between funnel stages."
  },
  "counterbalance_reasons": {
    "anti-tunnel-vision": "Checks that a narrow active batch has not hidden a plausible competing source or interpretation."
  },
  "redundancy_reasons": {
    "attention-compression-scaffold": "Compression reduces representation size; ABF additionally governs stage order and concurrent activation.",
    "scoped-loader": "Loader selects material; ABF budgets and stages its processing after selection."
  },
  "conflict_rules": [
    "Source-boundary and authority rules control what may enter the funnel.",
    "If compacting an item would lose evidence needed for verification, retain or reload the source rather than forcing it through the budget."
  ],
