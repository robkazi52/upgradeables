  "mechanism_basis": "recovered",
  "mechanism": "Translate the locked goal and constraints into a modular plan, select only the necessary OS layers, Genes, Cores, Upgradeables, references, and validators, then coordinate their ordered execution. After execution, run a separate critique, route localized defects to bounded repair, synthesize one result, and emit the minimum continuation state. The orchestrator owns coordination, not every domain operation.",
  "procedure": [
    "Lock the goal, constraints, deliverable, authority, and completion criteria.",
    "Decompose the architecture into modules with explicit interfaces and dependencies.",
    "Select the minimum required components and resolve authority, conflict, and load order.",
    "Coordinate execution or delegation while passing only explicit bounded state.",
    "Critique the assembled result, apply localized repair, synthesize, and emit a compact state snapshot."
  ],
  "always_do": [
    "Preserve the defining invariant: explicit modular interfaces, authority resolution, independent critique, and continuation state.",
    "Record material routing, transition, and failure decisions in explicit task state."
  ],
  "never_do": [
    "returning a flat component list or impersonating the domain execution agent",
    "Never claim hidden state, unavailable host capability, or authority beyond the active Skill."
  ],
  "interaction_reasons": {
    "scoped-loader": "Activates only the modules selected by the architecture plan.",
    "state-snapshot": "Captures the goal, locked decisions, active modules, open issues, and next step after synthesis."
  },
  "counterbalance_reasons": {
    "cognitive-governor": "Bounds architectural exploration and prevents orchestration from becoming endless redesign."
  },
  "redundancy_reasons": {
    "ultimate-suite-supervisor": "The suite supervisor governs modes and pack health in an existing full OS; Architect Orchestrator designs and coordinates the task architecture itself."
  },
  "conflict_rules": [
    "Host, system, domain, and explicit user authority take precedence over this component.",
