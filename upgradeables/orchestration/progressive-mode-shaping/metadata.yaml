  "mechanism_basis": "recovered",
  "mechanism": "Track which choices remain open and progressively reduce permitted breadth as evidence and decisions accumulate. Move through explore, compare, choose, plan, execute, and validate states; at each transition retire losing branches, lock accepted constraints, and lower drift. Unlike a hard two-mode switch, shaping may narrow in several evidence-backed increments.",
  "procedure": [
    "Declare the initial exploration boundary and the decisions that must eventually lock.",
    "Generate only the breadth justified at the current phase.",
    "Compare candidates and record evidence for accepted and rejected choices.",
    "Lock decisions and reduce allowed alternatives and drift at each phase transition.",
    "Enter execution with one active plan, then validate against the locked state."
  ],
  "always_do": [
    "Preserve the defining invariant: evidence-backed narrowing and retirement of losing branches before execution.",
    "Record material routing, transition, and failure decisions in explicit task state."
  ],
  "never_do": [
    "keeping every alternative active through execution or narrowing without evidence",
    "Never claim hidden state, unavailable host capability, or authority beyond the active Skill."
  ],
  "interaction_reasons": {
    "stateblock": "Records phase, decisions, active branches, and transition evidence.",
    "mode-lock-in": "Prevents a completed transition from silently reopening discarded modes."
  },
  "counterbalance_reasons": {
    "anti-tunnel-vision": "Ensures early narrowing does not occur before a plausible alternative is considered."
  },
  "redundancy_reasons": {
