  "mechanism": "For each event, preserve source and time, normalize it into the state schema, classify affected fields, compare with the current version, resolve contradiction by authority and recency rules, commit an atomic delta, derive consumer-specific projections, and emit a checkpoint. History remains available, but only the resolved current state drives action.",
  "procedure": [
    "Ingest one event with source, time, and authority metadata.",
    "Normalize it without discarding the original payload pointer.",
    "Classify affected state fields and compare against the current version.",
    "Resolve additions, updates, contradictions, and retractions using explicit precedence.",
    "Commit the delta atomically and increment the version.",
    "Refresh downstream projections and checkpoint the transition."
  ],
  "always_do": [
    "preserve event order and provenance",
    "distinguish current state from history",
    "resolve contradictions before projection",
    "version commits"
  ],
  "never_do": [
