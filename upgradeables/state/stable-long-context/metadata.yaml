  "mechanism_basis": "recovered",
  "mechanism": "Maintain an invariant anchor containing task, authority, definitions, accepted decisions, and open obligations; keep detailed material behind stable indexed pointers; periodically reconcile new state, mark superseded items, and regenerate a compact current view. Retrieval expands only the region needed for the next step, and final validation checks output against the anchors rather than conversational recency.",
  "procedure": [
    "Establish task, authority, terminology, and zero-drift facts as anchors.",
    "Index detailed evidence and prior artifacts with stable identifiers.",
    "At checkpoints, merge accepted deltas and mark replaced state as superseded.",
    "Compact the active view while preserving pointers and unresolved items.",
    "On resume, load the anchor first, then retrieve only the relevant detail.",
    "Validate major outputs against the current anchors and source records."
  ],
  "always_do": [
    "distinguish current, superseded, and unresolved state",
    "keep stable retrieval pointers",
    "re-anchor after major transitions"
  ],
  "never_do": [
    "summarize away locked constraints",
    "treat the newest statement as automatically authoritative",
    "carry the full transcript as active working state"
  ],
  "interaction_reasons": {
    "stateblock": "Holds the compact current-state anchor.",
    "sequential-memory-state-engine": "Supplies ordered deltas and current/history distinction.",
    "attention-compression-scaffold": "Builds a smaller task-local view from the indexed long context."
  },
  "counterbalance_reasons": {
    "scoped-loader": "Prevents resume from eagerly loading the entire archive.",
    "drift-suppression": "Detects meaning changes introduced by repeated compaction."
  },
  "redundancy_reasons": {
    "working-memory-lock-in": "WM Lock should be the critical active subset of the long-context anchor, not a parallel truth store.",
    "state-snapshot": "Snapshots preserve versions; stable context manages which version and detail remain active."
  },
  "conflict_rules": [
    "Explicit authority and accepted state transitions outrank recency.",
    "If compaction cannot preserve a high-impact nuance, retain the original excerpt or pointer in the active view."
  ],
