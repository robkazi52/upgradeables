  "mechanism": "Maintain an explicit schema of externally useful reasoning state: verified facts with provenance, user-provided constraints, labeled assumptions, concise conclusion summaries, unresolved questions, confidence, and next action. The block records what another worker needs to continue; it never stores token-level private deliberation or presents inference as evidence.",
  "procedure": [
    "Define the minimum state schema and sensitivity boundary.",
    "Populate facts only from cited or user-provided material and label assumptions separately.",
    "Record concise decision rationales and confidence rather than hidden reasoning traces.",
    "Update changed fields at checkpoints and preserve provenance.",
    "Project only the fields needed by the next consumer."
  ],
  "always_do": [
    "separate facts, assumptions, and conclusions",
    "attach provenance to evidence-bearing fields",
    "keep the record concise and inspectable"
  ],
  "never_do": [
    "request or reveal private chain-of-thought",
    "store unsupported inference as a fact",
    "persist secrets merely because they appeared in context"
  ],
