  "mechanism_basis": "recovered",
  "mechanism": "Quarantine the failed artifact, extract a ledger of verified facts, citations, requirements, decisions, and protected wording, and design a fresh structure from that ledger rather than editing the old prose in place. Reintroduce each locked atom with provenance, validate global coherence and coverage, and compare against the ledger—not against the failed wording—as the acceptance baseline.",
  "procedure": [
    "Demonstrate systemic failure: wrong architecture, cross-section contradiction, or broken source mapping that resists bounded repair.",
    "Extract and classify locked facts, citations, constraints, requirements, and accepted decisions.",
    "Set the failed draft aside and create a new outline or artifact structure from the locked ledger.",
    "Rebuild content section by section, attaching every factual claim to its source or ledger atom.",
    "Validate requirement coverage, global coherence, citation mapping, and absence of imported failed assumptions.",
    "Compare the rebuilt artifact with the locked ledger and record intentionally discarded generated material."
  ],
  "always_do": [
    "prove local repair is insufficient",
    "build a locked-atom ledger before rewriting",
    "reconstruct from verified state rather than memory of the old prose",
    "validate global source mapping"
  ],
  "never_do": [
    "use regeneration for one awkward sentence",
    "discard accepted decisions because the wording is inconvenient",
    "copy incoherent passages wholesale into the new structure",
    "claim historical wording was preserved when only semantics were locked"
  ],
  "interaction_reasons": {
    "task-set-lock-in": "Task-Set Lock-In preserves the goals and requirements during reconstruction.",
    "surgery-edit": "Surgery can replace the artifact's architecture before Regenerative Rewrite repopulates it.",
    "citation-fidelity": "Citation Fidelity ensures the rebuilt claims remain mapped to original sources."
  },
  "counterbalance_reasons": {
    "micro-repair": "Micro-Repair should be tried first for bounded defects and prevents unnecessary regeneration."
  },
  "redundancy_reasons": {
    "surgery-edit": "Both address macro failure, but Surgery changes structural interfaces while Regenerative Rewrite reconstructs content from locked truth and constraints."
  },
  "conflict_rules": [
    "Verified facts, citations, and non-negotiable requirements survive even if they complicate the new structure.",
    "If the architecture alone is defective, Surgery may define the replacement skeleton; regeneration then fills it.",
    "If no reliable locked ledger can be formed, stop for source recovery rather than regenerate from guesses."
  ],
