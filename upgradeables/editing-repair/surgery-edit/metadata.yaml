  "mechanism": "Declare the failing structural boundary and why CRISPR cannot preserve it, inventory every inbound and outbound interface, and define a replacement architecture with mapped invariants. Plan old-to-new state migration, adapters, staged cutover, observability, and rollback; change the structure in bounded phases, validate each dependent contract, then remove the old path only after the replacement passes global checks.",
  "procedure": [
    "Document the architecture-level failure and evidence that local editing is insufficient.",
    "Inventory components, state, public and internal interfaces, dependents, precedence rules, and invariants.",
    "Design the replacement structure and map every old responsibility and interface to retain, adapt, retire, or explicitly reject.",
    "Define migration order, compatibility adapters, checkpoints, observability, rollback, and cutover criteria.",
    "Implement or specify the replacement in stages while validating each interface and state transfer.",
    "Cut over only when criteria pass; remove the old structure, audit for orphaned references, and record irreversible decisions."
  ],
  "always_do": [
    "prove macro scope",
    "inventory interfaces before cutting",
    "map invariants and state migration",
    "stage cutover with rollback",
    "audit orphaned dependents"
  ],
  "never_do": [
    "invoke Surgery for a local defect",
    "replace structure without a responsibility map",
    "run old and new precedence rules ambiguously",
    "remove the old path before dependent contracts pass"
  ],
  "interaction_reasons": {
    "regenerative-rewrite": "Regenerative Rewrite can repopulate a replaced structure from locked truth after Surgery defines the new architecture.",
    "task-set-lock-in": "Task-Set Lock-In preserves objectives and non-negotiable invariants across the migration.",
    "forethought-checkpoints": "Forethought gates irreversible cutover and retirement steps."
