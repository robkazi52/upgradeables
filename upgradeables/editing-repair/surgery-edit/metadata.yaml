  "counterbalance_reasons": {
    "crispr-edit": "CRISPR is preferred when the change fits a bounded invariant-preserving patch and prevents unnecessary surgery.",
    "micro-repair": "Micro-Repair handles isolated defects without architecture disruption."
  },
  "redundancy_reasons": {
    "regenerative-rewrite": "Both operate globally; Surgery changes structural components and interfaces, while Regenerative Rewrite rebuilds content against a locked ledger."
  },
  "conflict_rules": [
    "Use CRISPR when all required behavior can coexist with current interfaces inside a bounded patch.",
    "A hard invariant without a valid old-to-new mapping blocks cutover.",
    "If rollback is impossible, raise the validation threshold and obtain explicit authority before commitment."
  ],
