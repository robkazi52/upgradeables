  "mechanism_basis": "recovered",
  "mechanism": "Construct a patch contract before editing: exact target coordinates, requested semantic delta, protected invariants, allowed collateral region, and validation probes. Snapshot the target plus its immediate dependency boundary, apply the smallest diff that realizes the delta, and compare before/after behavior on both the changed case and invariant cases. A patch that requires broad remapping is rejected and escalated to Surgery rather than stretched into disguised rewrite.",
  "procedure": [
    "Identify the exact editable unit and the request's semantic delta.",
    "Enumerate invariants: facts, IDs, interfaces, precedence, citations, unaffected behaviors, and formatting contracts that must not change.",
    "Trace immediate inbound and outbound dependencies to set a finite collateral boundary.",
    "Create and apply the smallest patch inside that boundary.",
    "Run a positive probe for the new behavior and negative probes for each protected invariant.",
    "Inspect the diff for unrelated changes; accept, revert-and-redesign, or escalate to Surgery if the boundary cannot hold."
  ],
  "always_do": [
    "declare target and invariants before editing",
    "keep a before-state for comparison",
    "test both the intended change and unchanged behaviors",
    "inspect the actual diff"
  ],
  "never_do": [
    "use search-and-replace without checking semantic scope",
    "rename or reorder unrelated elements for cleanliness",
    "claim success from syntax alone",
    "continue expanding the patch boundary until it becomes a macro rewrite"
  ],
  "interaction_reasons": {
    "invariance-stress-scaffold": "Invariance Stress turns the protected set into explicit negative tests.",
    "micro-repair": "Micro-Repair is the lighter local repair discipline used inside a CRISPR patch.",
    "critical-atomic-verification": "Atomic verification validates the exact facts, tokens, or rules touched."
  },
  "counterbalance_reasons": {
    "surgery-edit": "Surgery takes over when the edit cannot preserve the current architecture or interfaces within a bounded region."
  },
  "redundancy_reasons": {
    "micro-repair": "Both minimize change, but CRISPR adds a structured target contract, dependency boundary, and invariant test matrix for OS-like artifacts.",
    "safe-rewrite": "Safe Rewrite protects facts during prose transformation; CRISPR applies a precise semantic patch to any structured artifact."
  },
  "conflict_rules": [
    "Locked safety, truth, and authorization invariants cannot be included in the requested delta.",
    "If the new behavior and protected invariants cannot coexist, stop and expose the conflict.",
    "If more than the bounded dependency region must change, route to Surgery with a migration plan."
  ],
