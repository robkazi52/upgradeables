  "mechanism": "Represent the conflict as claim A, claim B, and the condition under which they cannot coexist; inspect scope, time, modality, and authority to decide whether it is real. If real and locally adjudicable, patch only the unsupported or misstated unit, then retest the pair and nearby dependents. If authority is insufficient, preserve the conflict explicitly instead of choosing by fluency.",
  "procedure": [
    "Extract the two conflicting claims and their provenance.",
    "Normalize their scope, time, subject, quantity, and modality to confirm a true contradiction.",
    "Determine which claim is locked, better supported, or requires escalation.",
    "Edit the smallest clause, field, or local rule that resolves the inconsistency.",
    "Re-evaluate both claims and any directly dependent conclusion; report unresolved conflict when evidence cannot adjudicate."
  ],
  "always_do": [
    "prove the contradiction before editing",
    "preserve the better-supported or locked claim",
    "recheck both sides and direct dependents"
  ],
  "never_do": [
    "flatten legitimate perspectives into one claim",
    "silently choose a side without authority",
    "rewrite unrelated sections to make the artifact sound consistent"
  ],
  "interaction_reasons": {
    "micro-repair": "Micro-Repair supplies the minimal patch discipline after the contradiction is localized.",
    "bidirectional-consistency": "Bidirectional Consistency can detect whether upstream and downstream claims disagree in both directions."
  },
  "counterbalance_reasons": {
    "multi-truth-gating": "Multi-Truth Gating prevents repair when claims are merely different scoped truths rather than contradictions."
  },
  "redundancy_reasons": {
    "micro-repair": "Micro-Repair handles any local defect; this pack adds contradiction normalization, authority adjudication, and two-sided retesting."
