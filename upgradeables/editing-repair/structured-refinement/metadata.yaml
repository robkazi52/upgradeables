  "mechanism_basis": "recovered",
  "mechanism": "Classify defects before editing and run passes in dependency order: facts and source mapping first, structure and requirement coverage second, style and pedagogy third, final validation last. Accepted decisions are locked between passes, and a later pass may not silently reopen an earlier one.",
  "procedure": [
    "Inventory defects and assign each to factual, structural, stylistic, or validation class.",
    "Correct facts, citations, and locked constraints; freeze the accepted semantic ledger.",
    "Repair ordering, dependencies, section roles, and requirement coverage without changing the frozen facts.",
    "Adjust voice, clarity, and pedagogy without changing facts or structure except where explicitly authorized.",
    "Run an independent final check across all classes and use Bounded ExIt to decide whether another pass is justified."
  ],
  "always_do": [
    "separate defect classes",
    "fix upstream factual issues before downstream polish",
    "lock accepted decisions between passes",
    "perform a cross-class final validation"
  ],
  "never_do": [
    "combine fact correction and free stylistic invention",
    "let a later pass silently undo an earlier one",
    "polish a structure already known to be globally invalid"
  ],
  "interaction_reasons": {
    "safe-rewrite": "Safe Rewrite protects frozen semantics during style and format passes.",
    "bounded-exit": "Bounded ExIt decides whether another class-specific pass has sufficient value.",
    "micro-repair": "Micro-Repair implements each localized correction selected within a pass."
  },
  "counterbalance_reasons": {
    "regenerative-rewrite": "Regeneration replaces the entire cycle when architecture or source mapping is systemically unrecoverable."
  },
  "redundancy_reasons": {
    "bounded-exit": "Both govern iteration, but Structured Refinement defines pass content and order while Bounded ExIt controls continuation.",
    "safe-rewrite": "Safe Rewrite is one preservation rule used inside multiple refinement passes."
  },
  "conflict_rules": [
    "Factual correctness outranks structural elegance and style.",
    "A later pass that discovers an upstream defect returns explicitly to the relevant pass and revalidates downstream results.",
    "If the defect inventory shows architecture failure, stop the cycle and escalate."
  ],
