  "mechanism_basis": "recovered",
  "mechanism": "Define a repair window around the smallest unit that fails an explicit criterion, freeze the surrounding accepted region, patch only that unit and any directly required connective token, then compare the window before and after. Widen once only when a direct dependency proves the first window insufficient; recurring or architecture-level failure escalates instead of allowing scope creep.",
  "procedure": [
    "Identify the exact failed criterion and the smallest text, field, rule, or code unit causing it.",
    "Mark the surrounding accepted content and locked facts as frozen.",
    "Draft the smallest replacement that satisfies the criterion.",
    "Check boundary coherence with the immediately preceding and following units.",
    "Verify the target defect is gone and no frozen atom changed.",
    "If repair requires broad movement or repeats elsewhere, stop and route to Structured Refinement, Regenerative Rewrite, or Surgery."
  ],
  "always_do": [
    "name the defect before patching",
    "freeze correct surroundings",
    "compare changed atoms",
    "recheck both local boundaries"
  ],
  "never_do": [
    "rewrite for style outside the repair window",
    "expand scope because adjacent prose could also be improved",
    "use local repair to conceal systemic failure"
  ],
  "interaction_reasons": {
