  "redundancy_reasons": {
    "crispr-edit": "Both are precise; Micro-Repair is the general smallest-fault correction, while CRISPR uses a formal patch contract for structured systems.",
    "safe-rewrite": "Safe Rewrite governs dimensions of prose transformation; Micro-Repair governs defect scope."
  },
  "conflict_rules": [
    "Do not preserve a frozen neighbor if it is proven part of the defect; explicitly widen the window instead.",
