  "mechanism_basis": "recovered",
  "mechanism": "Extract a before-state ledger of factual and constraint atoms, mark the dimensions authorized to change, perform the rewrite only along those dimensions, then compare names, numbers, dates, quotes, citations, modality, requirements, and causal claims. Any atom difference not explicitly authorized is reverted or surfaced for approval.",
  "procedure": [
    "Identify authorized change dimensions such as tone, length, format, or reading level.",
    "Extract locked atoms: claims, entities, numbers, dates, quotations, citations, requirements, negations, and uncertainty markers.",
    "Rewrite without adding evidence or changing the locked atoms.",
    "Diff the rewritten artifact against the atom ledger and inspect citation-to-claim fit.",
    "Restore unauthorized changes and report any requested transformation that cannot preserve meaning."
  ],
  "always_do": [
    "separate semantic atoms from surface form",
    "preserve modality and uncertainty",
    "recheck citations against the rewritten claims"
  ],
  "never_do": [
    "add plausible facts for smoothness",
    "alter numbers or named entities silently",
    "turn qualified language into certainty",
    "move a citation so it appears to support a different claim"
  ],
  "interaction_reasons": {
    "micro-repair": "Micro-Repair bounds the rewritten region when only one passage is defective.",
    "citation-fidelity": "Citation Fidelity performs the source-to-claim validation required after wording changes.",
    "style-alignment": "Style Alignment specifies one authorized surface dimension while Safe Rewrite protects semantics."
  },
  "counterbalance_reasons": {
    "regenerative-rewrite": "Regenerative Rewrite is needed when preservation of the old structure prevents a coherent result."
  },
  "redundancy_reasons": {
    "style-alignment": "Style Alignment selects the target voice; Safe Rewrite is the preservation guard across any transformation dimension.",
    "crispr-edit": "CRISPR changes a named semantic rule while preserving other invariants; Safe Rewrite generally forbids semantic change and transforms expression."
  },
  "conflict_rules": [
    "Truth and locked constraints outrank requested style.",
    "If shortening would remove a required qualification, keep the qualification or report the conflict.",
    "Exact quotations remain exact unless the user authorizes conversion to paraphrase."
  ],
