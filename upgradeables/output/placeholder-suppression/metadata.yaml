  "mechanism_basis": "recovered",
  "mechanism": "Run a two-layer completion scan: a lexical detector for markers such as TODO, TBD, FIXME, bracket prompts, dummy domains, sample IDs, and unresolved interpolation syntax; then a schema detector for empty required sections, null required fields, and uninstantiated variables. Classify every hit using a narrow allowlist for intentional template, example, or redaction contexts; all other hits must be filled from authority, removed with requirement revalidation, or explicitly labeled unresolved before release.",
  "procedure": [
    "Load the artifact's required sections, fields, and variable schema.",
    "Scan text and code for known marker tokens, dummy values, bracketed instructions, and unresolved interpolation forms.",
    "Scan structure for empty or default-valued required elements.",
    "Classify hits as accidental, intentionally illustrative, approved redaction, or genuinely unresolved using context and an explicit allowlist.",
    "Resolve accidental hits from authoritative inputs, omit only when the requirement permits, and label genuine gaps with impact and owner.",
    "Rescan the final artifact and fail the release gate on any unclassified or accidental hit."
  ],
  "always_do": [
    "combine lexical and structural scans",
    "use contextual allowlisting rather than global token exceptions",
    "rescan after resolution",
    "distinguish explicit unresolved disclosure from accidental placeholder leakage"
  ],
  "never_do": [
    "replace unknown values with plausible inventions",
    "delete a required section just to clear the scan",
    "flag every bracket in code or citation as a placeholder",
    "allow an unclassified marker in final output"
  ],
  "interaction_reasons": {
    "safe-rewrite": "Safe Rewrite removes or labels placeholders without altering neighboring facts.",
    "parallel-qms": "Final Validation treats an unresolved accidental marker as a release-blocking defect."
  },
  "counterbalance_reasons": {
    "safe-rewrite": "An explicit template context protects intentional placeholders from destructive suppression."
  },
  "redundancy_reasons": {
    "grounding-no-invention": "Grounding prevents invented replacements; Placeholder Suppression specifically detects unfinished output artifacts and completion gaps."
  },
  "conflict_rules": [
    "Never fabricate content to satisfy completion.",
    "Approved template and example placeholders remain only when clearly scoped and non-executable.",
    "A required unknown is labeled unresolved and blocks completion when the contract requires a concrete value."
  ],
