  "mechanism": "Set an explanation contract consisting of the outcome, the minimum causal or evidentiary bridge, required caveats, and the next action. Draft those blocks first, then test every additional sentence with a deletion probe: if removal does not impair correctness, comprehension, verification, safety, or actionability for the target reader, delete it. This mechanism is modern; only the exact historical scaffold name was recovered.",
  "procedure": [
    "Identify the reader, requested depth, decision or action, and risk tier.",
    "List mandatory explanation blocks: answer, indispensable why, evidence or method needed for trust, caveats, and next action.",
    "Draft one compact block for each mandatory need.",
    "Run a deletion probe sentence by sentence against correctness, comprehension, verification, safety, and actionability.",
    "Restore any deleted bridge whose absence creates a knowledge jump; stop when remaining content is necessary or explicitly requested."
  ],
  "always_do": [
    "lead with the outcome",
    "preserve qualifications that change action",
    "include enough bridge for the target reader to verify or follow the result",
    "label the mechanism as modern"
  ],
  "never_do": [
    "equate minimality with unexplained assertion",
    "remove safety or uncertainty language for brevity",
    "repeat the same conclusion in several formats without need",
    "claim this procedure is historically recovered"
  ],
