  "mechanism": "Translate the authorized style request into an observable style vector—tone, formality, sentence rhythm, vocabulary level, structure, formatting, and disallowed tendencies—while extracting a separate semantic invariant ledger. Transform surface choices toward the style vector, protect quoted and zero-drift zones, then score both conformance and semantic preservation; truth, task, and citation constraints veto any stylistic gain.",
  "procedure": [
    "Extract the authorized style source and convert it into observable positive and negative constraints.",
    "Lock facts, reasoning relations, requirements, citations, uncertainty, and exact-text zones.",
    "Revise diction, rhythm, organization, and formatting only where the style contract permits.",
    "Compare the result against the style vector using representative passages rather than vague resemblance.",
    "Run a semantic and citation diff; revert any stylistic change that alters truth, logic, or attribution."
  ],
  "always_do": [
    "use explicit style dimensions",
    "keep style subordinate to truth and task",
    "protect quotes and zero-drift zones",
    "validate semantic preservation after styling"
  ],
  "never_do": [
    "invent facts or confidence to sound more authoritative",
    "mimic unauthorized personal quirks",
    "let brand voice erase required warnings",
    "treat subjective vibe as the only acceptance test"
  ],
