  "mechanism_basis": "recovered",
  "mechanism": "Build a compact audience model—known prerequisites, target capability, jargon tolerance, and action context—then choose the smallest conceptual steps that bridge from that model to the target. Define or replace jargon at first use, order prerequisite before dependent ideas, add an example only where it resolves a likely misconception, and run an accuracy-backcheck against the unsimplified claim.",
  "procedure": [
    "Identify the reader's likely starting knowledge and the capability they need after reading.",
    "List prerequisites and terms that the explanation currently assumes.",
    "Sequence content from familiar anchor through the minimum conceptual bridge to the target.",
    "Define necessary jargon or replace it with accurate plain language; add a representative example where abstraction alone is likely to fail.",
    "Back-check every simplification, analogy, and example against the original technical claim and retain important limitations."
  ],
  "always_do": [
    "preserve accuracy before accessibility",
    "make prerequisite order explicit",
    "define unavoidable jargon",
    "check analogies for where they break"
  ],
  "never_do": [
    "talk down to the reader",
    "remove uncertainty or boundary conditions to sound simple",
    "use an analogy that changes the mechanism",
    "assume more domain knowledge than the audience model supports"
  ],
