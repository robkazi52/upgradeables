  "mechanism": "Name the leading path and at least one genuinely plausible competitor, specify the observation that would distinguish them, and compare only on that discriminating evidence. The controller is bounded: it prevents first-path lock-in without turning every task into open-ended brainstorming.",
  "procedure": [
    "State the current favored hypothesis or plan and the evidence supporting it.",
    "Generate one or two materially different competitors, not cosmetic restatements.",
    "For each candidate, identify its strongest confirming signal and strongest disconfirming signal.",
    "Acquire or inspect the cheapest decisive evidence available.",
    "Select, synthesize, or explicitly preserve uncertainty; retire alternatives that lose on the discriminating evidence."
  ],
  "always_do": [
    "make the favored path explicit",
    "require competitors to differ in causal account or implementation strategy",
    "define a stopping condition before expanding the search"
  ],
  "never_do": [
    "invent weak straw alternatives merely to satisfy a count",
    "keep rejected branches active after decisive evidence",
    "override a hard truth or safety constraint in the name of exploration"
  ],
