  "mechanism_basis": "recovered",
  "mechanism": "Each pass evaluates the artifact against locked goals, chooses the single highest-value remaining defect, repairs it, and re-evaluates. Exit occurs on threshold satisfaction, budget exhaustion, or diminishing expected improvement; the historical acronym expansion is deliberately left unrecovered.",
  "procedure": [
    "Lock acceptance criteria and a maximum pass or cost budget.",
    "Score the current artifact against those criteria.",
    "Choose the highest-impact repair that can be completed without reopening accepted decisions.",
    "Apply the repair and record whether the target metric improved.",
    "Stop when criteria pass, no repair has positive expected value, or the budget is reached; otherwise repeat."
  ],
  "always_do": [
    "define the exit condition before iterating",
    "repair the highest-value defect first",
    "re-evaluate after every pass"
  ],
  "never_do": [
    "iterate merely because another rewrite is possible",
    "use a quality score to waive a mandatory truth or safety check",
    "invent an expansion for ExIt"
  ],
  "interaction_reasons": {
    "micro-repair": "Micro-Repair supplies the smallest correction for the defect selected by the loop.",
    "structured-refinement": "Structured Refinement separates defect classes; Bounded ExIt decides whether another class-specific pass is worth doing.",
    "parallel-qms": "Parallel-QMS can score candidates or revisions on multiple quality dimensions before the exit decision."
  },
  "counterbalance_reasons": {
    "reasoning-scale-controller": "The scale controller can increase depth when risk justifies it, while Bounded ExIt prevents that depth from becoming unbounded."
  },
  "redundancy_reasons": {
    "structured-refinement": "Both organize revision, but Structured Refinement orders defect classes and Bounded ExIt owns continuation and termination."
  },
  "conflict_rules": [
    "Mandatory acceptance checks outrank a pass budget; if budget expires first, return blocked rather than pass.",
    "A newly discovered architecture failure hands off to Surgery or Regenerative Rewrite instead of repeating local passes."
  ],
