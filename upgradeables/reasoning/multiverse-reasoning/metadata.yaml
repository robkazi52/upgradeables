  "mechanism_basis": "recovered",
  "mechanism": "Open exactly two or three branch records that differ in strategy, causal model, or architecture. Give every branch the same locked facts, requirements, risk limits, and evaluation rubric; develop each only far enough to expose its decisive tradeoffs. Score them, apply hard vetoes before soft preferences, select or synthesize one committed path, and mark every losing branch retired so its assumptions cannot leak into execution.",
  "procedure": [
    "Lock shared facts, goals, constraints, risk boundaries, and a branch budget of two or three.",
    "Define branches with a one-sentence strategy, distinctive assumption, predicted advantage, and disconfirming condition.",
    "Develop each branch to the same decision depth; do not let the favored branch consume the entire budget.",
    "Evaluate all branches on the same dimensions, such as truth, requirement coverage, coherence, cost, risk, and reversibility.",
    "Veto any branch that violates a hard constraint, then select the strongest survivor or synthesize only compatible components.",
    "Emit one committed plan plus a retirement record naming rejected branches and why they must not influence downstream work."
  ],
  "always_do": [
    "make branches materially distinct",
    "use a common rubric",
    "apply hard constraints before aggregate scores",
    "retire losing branches explicitly"
  ],
  "never_do": [
    "create unbounded universes",
    "score one branch on easier criteria",
    "blend mutually inconsistent assumptions during synthesis",
    "carry losing-branch instructions into the chosen execution state"
  ],
  "interaction_reasons": {
    "parallel-qms": "Parallel-QMS provides the shared multidimensional scoring and collapse gate.",
    "anti-tunnel-vision": "Anti-Tunnel Vision audits whether branch diversity is real and whether the favorite was preselected.",
    "task-set-lock-in": "Task-Set Lock-In gives all branches identical goals and non-negotiable constraints."
  },
  "counterbalance_reasons": {
    "bounded-exit": "Bounded ExIt prevents branch development or comparison from continuing after the decision value falls below cost.",
    "neuro-focus": "After collapse, Neuro-Focus narrows execution to the selected universe."
  },
  "redundancy_reasons": {
    "anti-tunnel-vision": "Both counter first-path fixation; Multiverse manages full candidate state and collapse, while Anti-Tunnel can be a lighter rival check.",
    "parallel-qms": "QMS evaluates alternatives but does not itself generate or retire branch worlds."
  },
  "conflict_rules": [
    "A hard truth, safety, or authorization veto cannot be outvoted by soft quality scores.",
    "Synthesis is allowed only when selected components share compatible assumptions and interfaces.",
    "If no branch passes, return the blocking constraint or request evidence rather than select the least-invalid branch."
  ],
