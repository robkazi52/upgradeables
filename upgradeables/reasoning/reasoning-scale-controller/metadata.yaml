  "mechanism_basis": "recovered",
  "mechanism": "Route work through one controller: Subatomic for a fact, local relation, constraint, or sentence decision; Atomic for a small verified inference or action; Nano as a light intermediate structure whose detailed historical spec remains unrecovered; Micro for task-local scaffolds and dependencies; QMS for quality evaluation; Cosmic for global architecture, strategy, or long-horizon planning. Escalate when dependency span, ambiguity, irreversibility, or risk exceeds the current scale; de-escalate after the larger question is resolved.",
  "procedure": [
    "Identify the unit of work, dependency radius, uncertainty, and consequence of error.",
    "Choose the lowest scale that can represent all relevant dependencies.",
    "Execute only the operations appropriate to that scale.",
    "Escalate one or more levels when local reasoning exposes unresolved cross-unit dependencies, competing quality dimensions, or global architecture effects.",
    "After the higher-scale decision, return local implementation to the smallest adequate scale and record the boundary."
  ],
  "always_do": [
    "start at the smallest adequate scale",
    "escalate on concrete signals rather than prestige",
    "preserve global constraints when returning to local work",
    "keep Nano semantics modest because its detailed historical specification is unrecovered"
  ],
  "never_do": [
    "use Cosmic for a sentence edit",
    "solve architecture from isolated facts without aggregation",
    "invent a detailed historical Nano algorithm",
    "confuse QMS evaluation with generation"
  ],
  "interaction_reasons": {
    "cognitive-governor": "The governor budgets effort after the scale controller identifies the required scope.",
    "dynamic-depth-allocation": "Dynamic allocation varies effort within the selected scale as evidence and difficulty change.",
    "micro-scaffolding": "Micro-Scaffolding structures task-local dependencies when the controller selects Micro scale."
  },
  "counterbalance_reasons": {
    "bounded-exit": "Bounded ExIt caps repeated work at any selected scale.",
    "critical-atomic-verification": "Atomic verification prevents scale escalation from resting on bad fact-level units."
  },
  "redundancy_reasons": {
    "dynamic-depth-allocation": "Both tune reasoning effort, but the scale controller selects semantic scope while dynamic allocation adjusts depth or budget."
  },
  "conflict_rules": [
    "Risk-mandated review overrides the desire to stay at a cheaper scale.",
    "Cosmic conclusions must be decomposed back into verifiable local units before execution.",
    "Nano may be used only as a light intermediate label until historical mechanics are recovered."
