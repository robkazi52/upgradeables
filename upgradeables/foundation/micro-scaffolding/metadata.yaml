  "mechanism_basis": "recovered",
  "mechanism": "At the start of a fragile subtask, extract only the few invariants and checkpoints that could be lost locally, such as preserve all numbers, preserve citation mapping, change tone only, and do not alter the conclusion. Use that compact scaffold while performing the step, check the local result against it, then retire the scaffold immediately when the subtask is accepted. It remains strictly smaller and shorter-lived than the workflow's canonical StateBlock.",
  "procedure": [
    "Identify the current subtask and the specific failure risks within it.",
    "Select the minimum local invariants, evidence pointers, and next-step checkpoints needed to control those risks.",
    "Write a compact scaffold; do not copy unrelated global rules or full source material into it.",
    "Execute the subtask while checking decisions against the scaffold.",
    "Verify the local output against each scaffold item.",
    "Merge only durable decisions into StateBlock, then delete or mark the temporary scaffold retired."
  ],
  "always_do": [
    "Keep the scaffold task-local and smaller than canonical workflow state.",
    "Use concrete protected items rather than vague reminders.",
    "Retire it after the subtask so stale constraints cannot leak forward."
  ],
  "never_do": [
    "Do not expose private chain-of-thought.",
    "Do not build an elaborate visible plan for a trivial step.",
    "Do not let a local scaffold redefine global task authority or persist as canonical state."
  ],
  "interaction_reasons": {
    "task-set-lock-in": "Supplies the global task contract from which the local scaffold selects only currently fragile invariants.",
    "drift-suppression": "Uses the local checklist to detect divergence during execution and re-anchor without reloading the whole task.",
    "working-memory-cues": "Can express the few scaffold items as concise active reminders while the subtask runs."
  },
  "counterbalance_reasons": {
    "cognitive-governor": "Suppresses unnecessary scaffold creation when the local risk does not justify the added structure."
  },
  "redundancy_reasons": {
    "stateblock": "StateBlock is durable canonical task state; Micro-Scaffolding is disposable subtask state and should not duplicate it.",
    "working-memory-cues": "Cues are reminders; a micro-scaffold also defines a local sequence or acceptance checklist."
  },
  "conflict_rules": [
    "Global task locks and source boundaries outrank a local scaffold.",
    "If the subtask expands into an architecture-level problem, retire the scaffold and re-plan at the parent task level."
  ],
