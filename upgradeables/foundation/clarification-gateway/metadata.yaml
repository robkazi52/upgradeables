  "mechanism_basis": "recovered",
  "mechanism": "Classify each ambiguity by decision impact. If different plausible values would materially change correctness, authority, safety, or the requested deliverable, route to clarification when permitted. Otherwise choose the narrowest labeled assumption, preserve the unresolved field, or return the supported subset; do not turn every uncertainty into a user interruption.",
  "procedure": [
    "Extract missing variables, ambiguous terms, and instruction conflicts before substantive execution.",
    "For each item, compare plausible interpretations against the output contract and authority rules.",
    "Mark an item blocking only when the interpretations lead to materially different valid actions or conclusions.",
    "Ask one focused question for blocking items when interaction is available; otherwise state the narrow assumption or limit the result.",
    "Record the answer or assumption in task state so the same ambiguity is not reopened without new evidence."
  ],
  "always_do": [
    "Explain why a requested clarification changes the result.",
    "Prefer one consolidated, answerable question over serial interrogation.",
    "Label assumptions and unsupported branches."
  ],
  "never_do": [
    "Do not ask for information already present in the supplied state.",
    "Do not silently select a consequential interpretation.",
    "Do not use clarification as a substitute for ordinary analysis."
  ],
  "interaction_reasons": {
    "task-set-lock-in": "Writes confirmed answers and bounded assumptions into the locked task definition so downstream work uses one interpretation."
  },
  "counterbalance_reasons": {
    "bounded-exit": "Prevents clarification loops by terminating once the minimum blocking information is obtained or a bounded fallback is selected."
  },
  "redundancy_reasons": {
    "task-set-lock-in": "Task-Set Lock-In stores resolved task fields; Clarification Gateway decides which unresolved fields require intervention."
  },
  "conflict_rules": [
    "A higher-authority instruction not to ask questions converts the gate into assumption selection, not permission to ignore ambiguity.",
    "If no safe bounded assumption exists for a consequential decision, return the supported subset or abstain."
  ],
