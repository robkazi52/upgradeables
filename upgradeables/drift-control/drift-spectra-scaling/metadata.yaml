  "mechanism": "Define a small ordered scale from zero movement through narrow paraphrase, bounded abstraction/reorganization, to explicitly creative variation. Classify content units by consequence, source authority, reversibility, and user intent; attach a validation method to every band, and promote exceptional high-risk units to a stricter band regardless of surrounding prose.",
  "procedure": [
    "Define named drift bands and the semantic changes each permits.",
    "Segment content into units whose tolerances can be assessed independently.",
    "Score or judge consequence, authority, reversibility, and requested freedom.",
    "Assign each unit to a band and specify its validation test.",
    "Translate bands into controlled corridors and review effort.",
    "Reclassify exceptions when evidence or task intent changes."
  ],
  "always_do": [
    "define bands operationally",
    "classify at a useful content granularity",
    "attach a test to each band",
    "allow stricter local exceptions"
  ],
  "never_do": [
    "treat the scale as aesthetic temperature",
    "average immutable and flexible content into one band",
    "use a higher band to permit unsupported facts"
  ],
