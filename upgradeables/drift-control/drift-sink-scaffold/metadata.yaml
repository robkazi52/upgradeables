  "mechanism": "A cautious modern interpretation is a reversible quarantine ledger: move an explicitly classified branch out of the active view, record why, by whose authority, its provenance, dependencies, review condition, and stable pointer, then block automatic retrieval unless a matching review trigger fires. The sink is neither deletion nor a semantic garbage collector, and the unrecovered ECL label must not be expanded speculatively.",
  "procedure": [
    "Identify a branch that repeatedly causes drift and classify it as superseded, rejected, irrelevant, or low-authority.",
    "Check whether any active claim depends on it and whether contrary-evidence duties require visibility.",
    "Create a task-local sink entry with reason, authority, provenance, dependencies, and restore trigger.",
    "Remove it from automatic active retrieval while retaining its stable pointer.",
    "Review the sink at milestone or trigger events.",
    "Restore, archive, or delete only under the applicable authority and retention policy; retire the scaffold when the task ends."
  ],
  "always_do": [
    "make quarantine reversible",
    "retain provenance and reason",
    "check dependencies",
    "define review and retirement triggers"
  ],
  "never_do": [
    "use the sink to hide inconvenient evidence",
    "equate quarantine with deletion",
    "expand ECL or claim an unrecovered historical algorithm",
    "sink unresolved safety-critical branches"
  ],
