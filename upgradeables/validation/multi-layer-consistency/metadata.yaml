  "mechanism_basis": "normalized-from-recovered",
  "mechanism": "Define nested levels and invariants linking them, then validate both upward and downward: atoms must support their containing unit, units must compose into section or subsystem claims, and the global result must not assert anything contradicted below; conversely global constraints must be realized in the relevant lower layers. A pass requires agreement across boundaries, not independent passes at each level.",
  "procedure": [
    "Map the artifact into atom, local unit, intermediate group, and global levels.",
    "State invariants and claimed summaries at each boundary.",
    "Check upward support from atoms to local and global claims.",
    "Check downward realization of global constraints in lower levels.",
    "Locate contradictions, orphan claims, and locally valid but globally incompatible parts.",
    "Repair at the earliest causal level and rerun affected boundaries."
  ],
  "always_do": [
    "Check boundary relationships, not only each level in isolation.",
    "Trace global claims to lower-level support.",
    "Propagate lower-level uncertainty upward."
  ],
  "never_do": [
    "Infer global consistency from all local tests passing.",
    "Force consistency by deleting legitimate local exceptions without explanation."
  ],
  "interaction_reasons": {
    "parallel-qms": "HQMS is the specialized QMS mode that runs these hierarchical checks.",
    "bidirectional-consistency": "Strengthens upward support with downward realization.",
    "coherence-loops": "Repairs contradictions that span multiple layers."
  },
  "counterbalance_reasons": {
    "domain-mode-isolation": "Prevents constraints from one domain layer leaking into an unrelated one."
  },
  "redundancy_reasons": {
    "cross-universe-consistency": "Multi-Layer checks nested scales within one artifact; CUCM checks alternative branch worlds."
  },
  "conflict_rules": [
    "A lower-level verified contradiction defeats an unsupported global summary.",
    "An explicit global hard constraint requires lower-layer implementation or a documented exception."
  ],
