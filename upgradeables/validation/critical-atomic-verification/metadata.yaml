  "mechanism_basis": "recovered",
  "mechanism": "Build a dependency graph from the intended conclusion back to minimal truth-bearing atoms. Mark an atom critical when its falsity, reversal, or absence would change the conclusion or safe action. Verify every critical atom directly at depth proportional to risk; propagate any failed or unknown atom forward so the dependent conclusion is repaired, qualified, or blocked.",
  "procedure": [
    "State the conclusion or action being certified.",
    "Decompose it into atomic claims and dependencies.",
    "Use a removal or reversal test to mark critical atoms.",
    "Assign verification depth and evidence requirements by consequence.",
    "Verify each critical atom independently and record true, false, unknown, or conflicting.",
    "Recompute the conclusion from verified states.",
    "Block, repair, or qualify conclusions that depend on false or unresolved critical atoms."
  ],
  "always_do": [
    "Include qualifiers, negations, units, dates, and identities as atoms when material.",
    "Propagate uncertainty from atom to conclusion.",
    "Verify critical atoms with direct evidence where available."
  ],
  "never_do": [
    "Average a failed critical atom into an overall high score.",
    "Treat fluent wording as evidence.",
    "Hide an unresolved atom inside a broad paragraph-level pass."
  ],
  "interaction_reasons": {
    "citation-fidelity": "Audits whether cited evidence truly supports each atom.",
    "risk-tier-scaling": "Sets verification depth for each atom.",
    "cross-checking-chains": "Adds ordered independent checks to especially consequential atoms."
  },
  "counterbalance_reasons": {
    "dynamic-depth-allocation": "Prevents equal-cost verification of noncritical atoms."
  },
  "redundancy_reasons": {
    "multi-truth-gating": "Multi-Truth arbitrates candidate truths; CAV identifies and verifies the indispensable atoms within a conclusion."
  },
  "conflict_rules": [
    "A false critical atom vetoes any dependent conclusion.",
    "An unknown critical atom requires qualification or abstention, not a guessed value.",
    "Direct source evidence outranks derived narrative confidence."
  ],
