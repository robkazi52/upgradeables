  "mechanism_basis": "recovered",
  "mechanism": "For every citation-bearing claim, open the exact cited artifact and pass five independent tests: the artifact exists and is the represented edition; the cited passage entails the full claim including qualifiers; quoted text matches exactly; paraphrase retains scope, modality, polarity, and attribution; and evidence belongs to this claim rather than being borrowed from an adjacent citation, nearby sentence, or different source. A failure at any layer blocks the claim, even if the source is authoritative.",
  "procedure": [
    "Atomize each externally checkable claim and bind each citation to a specific atom.",
    "Resolve the cited artifact, version, locator, and authorship.",
    "Inspect the cited passage rather than relying on search snippets or secondary descriptions.",
    "Test entailment of subject, predicate, scope, date, quantity, and modal strength.",
    "For quotes, compare exact words and mark every omission or alteration.",
    "For paraphrases, compare meaning, qualifiers, uncertainty, and attribution.",
    "Check that evidence was not borrowed from an adjacent citation or adjacent passage.",
    "Downgrade, recite, replace, or remove any unsupported atom and record the decision."
  ],
  "always_do": [
    "Bind citations at claim-atom granularity.",
    "Preserve uncertainty and limitations from the source.",
    "Use direct primary support when the claim represents primary findings."
  ],
  "never_do": [
    "Treat source existence as proof of claim support.",
    "Use a search-result snippet as the final evidence check.",
    "Make a paraphrase more certain or general than the source.",
    "Let one citation silently support multiple unrelated neighboring claims."
  ],
  "interaction_reasons": {
    "grounding-no-invention": "Removes unsupported facts discovered by the citation audit.",
    "critical-atomic-verification": "Defines and checks the precise claim atoms cited.",
    "truth-priority-hierarchy": "Resolves conflicts among primary, secondary, and stale sources."
  },
  "counterbalance_reasons": {
    "specificity-penalty-gate": "Discourages unnecessary precision that the available citation cannot support."
  },
  "redundancy_reasons": {
    "critical-atomic-verification": "CAV may verify from any evidence; Citation Fidelity additionally audits citation identity, attachment, quotation, and paraphrase behavior."
  },
  "conflict_rules": [
    "The source passage outranks a draft's intended meaning.",
    "A precise unsupported subclaim must be removed even when the broader sentence is supported.",
    "A secondary source cannot be cited as if it were the primary experiment."
  ],
