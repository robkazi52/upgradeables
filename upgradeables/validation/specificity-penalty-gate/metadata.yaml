  "mechanism_basis": "modern-interpretation",
  "mechanism": "Tag specificity-bearing atoms—numbers, dates, named causes, unique identities, fine-grained scope, and certainty language—and compare each with the resolution of available evidence and actual task need. Unsupported precision receives a penalty that forces one of four actions: cite stronger evidence, widen to a supported range or class, label the detail provisional, or remove it. This scoring/gating procedure is not claimed as historical reconstruction.",
  "procedure": [
    "Identify all atoms whose precision materially narrows the claim.",
    "Record the evidence resolution and confidence for each atom.",
    "Ask whether the task outcome requires that degree of precision.",
    "Flag atoms more precise than evidence or need.",
    "Resolve each flag by stronger evidence, supported generalization, explicit provisional labeling, or removal.",
    "Recheck that generalization has not erased a decision-critical distinction."
  ],
  "always_do": [
    "Penalize precision mismatch rather than detail itself.",
    "Preserve verified exact values when decision-relevant.",
    "Label the mechanism and thresholds as modern interpretation."
  ],
  "never_do": [
    "Replace an unsupported exact number with a different guessed range.",
    "Make all writing vague by default.",
    "Attribute penalty weights or thresholds to unrecovered history."
  ],
  "interaction_reasons": {
    "grounding-no-invention": "Removes details that have no supporting evidence.",
    "epistemic-status-gating": "Supplies confidence and fact/inference/hypothesis labels.",
    "citation-fidelity": "Tests whether a citation supports the claimed degree of precision."
  },
  "counterbalance_reasons": {
    "critical-atomic-verification": "Protects exact details that are both supported and essential rather than generalizing them away."
  },
  "redundancy_reasons": {
    "grounding-no-invention": "Grounding rejects unsupported facts; this provisional gate specifically compares claim resolution to evidence resolution and task need."
  },
