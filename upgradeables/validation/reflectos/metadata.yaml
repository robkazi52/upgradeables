  "mechanism_basis": "recovered",
  "mechanism": "At a bounded checkpoint, re-read the session goal and current subgoal, compare the actual output to explicit requirements, audit contradictions, omissions, and risk, then select exactly one transition: accept, revise, or ask/escalate where permitted. After the transition, update the StateBlock to reflect task reality; reflection may correct process errors but may not invent facts or construct an identity narrative.",
  "procedure": [
    "Recheck the session goal and current subgoal.",
    "Compare the produced artifact or action with every explicit requirement.",
    "Audit contradictions, missing requirements, failed evidence, and material risk.",
    "Choose accept, revise, or ask/escalate when permitted.",
    "If revising, make the smallest requirement-linked correction and retest.",
    "Stop on acceptance, external dependency, or the declared loop budget.",
    "Update StateBlock with actual progress, decisions, remaining work, and evidence."
  ],
  "always_do": [
    "Anchor every critique to the goal, requirements, or observed risk.",
    "Choose an explicit loop transition.",
    "Update task state after the decision.",
    "Use a bounded iteration budget."
  ],
  "never_do": [
    "Invent facts to make the output appear complete.",
    "Reflect indefinitely without new evidence or a changed action.",
    "Build an identity or self-story in StateBlock.",
    "Expand scope merely because reflection found optional improvements."
  ],
  "interaction_reasons": {
    "stateblock": "Receives the updated factual work state after each loop decision.",
    "bounded-exit": "Enforces stop conditions on revise cycles.",
    "coherence-loops": "Handles broader cross-artifact inconsistencies identified during the audit."
  },
  "counterbalance_reasons": {
    "crispr-edit": "Restricts revisions to requirement-linked corrections."
  },
  "redundancy_reasons": {
    "coherence-loops": "ReflectOS decides whether work should be accepted, revised, or escalated; coherence loops specifically repair systemic inconsistency."
  },
  "conflict_rules": [
    "Explicit requirements and evidence outrank the reflector's preference.",
    "When a missing fact cannot be recovered, escalate or qualify rather than fabricate.",
    "A fixed loop budget stops revision but does not convert failure into acceptance."
  ],
