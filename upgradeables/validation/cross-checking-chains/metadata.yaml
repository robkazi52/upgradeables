  "mechanism": "Design a chain whose links have distinct jobs—such as identity/provenance, extraction, entailment, independent corroboration, and consequence testing. Each link receives the claim plus the prior evidence ledger, may add evidence or a typed failure, and cannot erase an upstream failure; certification requires every mandatory link to pass or an explicit resolution branch to close the discrepancy.",
  "procedure": [
    "Select the critical claim or atom.",
    "Enumerate its verification dependencies in causal order.",
    "Assign each link a distinct evidence source or validation lens.",
    "Define required input, pass condition, and typed failure for every link.",
    "Run links in order and preserve the accumulating ledger.",
    "Route discrepancies to repair or independent adjudication.",
    "Collapse only after all mandatory links and resolutions are complete."
  ],
  "always_do": [
    "Test independence between links that claim corroboration.",
    "Carry upstream failures forward visibly.",
    "Define an endpoint and mandatory links before running."
  ],
  "never_do": [
    "Count repeated use of one source as multiple corroborations.",
    "Let a downstream style or plausibility check erase a provenance failure.",
    "Extend the chain without a decision-relevant reason."
