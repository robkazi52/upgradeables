  "mechanism_basis": "recovered",
  "mechanism": "Run a forward check from source conditions to proposed result, then independently read the result backward to enumerate which source conditions it actually entails. Compare the reconstructed set with the locked source atoms; missing, invented, or many-to-one-collapsed atoms fail even when the forward narrative is fluent.",
  "procedure": [
    "Lock the source atoms and declared transformation contract.",
    "Verify that each source atom has a forward image in the result.",
    "Hide the source and reconstruct its implied atoms from the result alone.",
    "Compare reconstructed atoms with the locked set.",
    "Classify omissions, inventions, and ambiguity introduced by the mapping.",
    "Repair and repeat both directions."
  ],
  "always_do": [
    "Keep forward and reverse judgments separately inspectable.",
    "Test material constraints, not merely wording overlap."
  ],
  "never_do": [
    "Infer reverse consistency from a passing forward check.",
    "Demand literal reversibility when the contract permits labeled compression."
  ],
  "interaction_reasons": {
    "critical-atomic-verification": "Supplies atom-level units for the two directional passes.",
    "citation-fidelity": "Provides evidence bindings that can be traced from source to claim and reconstructed from claim to source."
  },
  "counterbalance_reasons": {
    "controlled-drift-corridors": "Prevents the reverse check from treating permitted abstraction as a defect."
  },
  "redundancy_reasons": {
    "multi-layer-consistency": "Multi-layer checks agreement across scales; bidirectional consistency checks the directionality of one transformation."
  },
  "conflict_rules": [
    "The declared transformation contract determines which information may be lost.",
    "A reverse contradiction on a locked atom overrides stylistic forward plausibility."
  ],
