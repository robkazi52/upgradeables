  "mechanism_basis": "recovered",
  "mechanism": "Declare a narrow set of exclusion predicates before scoring. Evaluate them independently of aggregate quality; if any predicate is evidenced, quarantine the candidate and require removal of the disqualifying state plus revalidation. The fermionic metaphor is operational only: incompatible states do not share the certified result, and the veto is never diluted by votes or averages.",
  "procedure": [
    "Define non-compensable predicates and required evidence.",
    "Run veto checks independently from quality scoring.",
    "Record the exact predicate, evidence, and affected candidate.",
    "Exclude or quarantine any triggered candidate.",
    "Permit repair only if the disqualifying state is removed rather than relabeled.",
    "Rerun the veto check before reconsidering certification."
  ],
  "always_do": [
    "Keep veto predicates narrow and inspectable.",
    "Preserve minority evidence of a decisive defect.",
    "Require proof of removal before clearing a veto."
  ],
  "never_do": [
    "Average a triggered veto into a composite score.",
    "Use the metaphor as a scientific claim.",
    "Turn aesthetic disagreement into a hard veto."
  ],
  "interaction_reasons": {
    "fail-closed-abstention": "Defines the safe response when a veto cannot be repaired or resolved.",
    "parallel-qms": "Preserves hard failures during global validator collapse.",
    "cross-universe-consistency": "Blocks branch hybrids with impossible coexisting assumptions."
  },
  "counterbalance_reasons": {
