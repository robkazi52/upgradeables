  "mechanism_basis": "recovered",
  "mechanism": "At predefined cadence or meaningful state transitions, compare a compact current-state snapshot against four anchors: objective, hard constraints, accepted decisions, and outstanding obligations. Emit a small delta signal—aligned, warning, or repair-required—and escalate to a full coherence loop only when the pulse detects material divergence.",
  "procedure": [
    "Capture a compact baseline of objective, constraints, decisions, and open obligations.",
    "Choose event-based or interval checkpoints proportional to task length.",
    "At each checkpoint, compare current state with every anchor.",
    "Classify differences as intended progress, harmless update, or drift.",
    "Repair small drift immediately; invoke a coherence loop for systemic mismatch.",
    "Refresh the baseline only after the change is explicitly accepted."
  ],
  "always_do": [
    "Keep the pulse cheap enough to run repeatedly.",
    "Distinguish authorized state change from drift.",
    "Escalate material discrepancies."
  ],
  "never_do": [
    "Silently rewrite the baseline to match current behavior.",
    "Use the heartbeat as a substitute for deep final validation."
  ],
