  "mechanism": "Estimate a total effort envelope from complexity, uncertainty, consequence, irreversibility, and the expected value of another check. Allocate caps for planning, execution, and validation, reserve extra capacity for high-risk unknowns, and periodically compare remaining defect or uncertainty value with remaining cost. The governor owns how much total reasoning is justified; it does not choose which regions receive that effort or how much work flows concurrently.",
  "procedure": [
    "Classify task complexity, uncertainty, consequence, and reversibility.",
    "Set an effort envelope and mandatory validation floor.",
    "Divide the envelope among planning, execution, verification, and contingency.",
    "Track evidence gained, defects removed, and budget consumed at milestones.",
    "Increase the envelope only when newly exposed risk has positive expected value; otherwise invoke the exit rule.",
    "Report blocked rather than declare completion if mandatory checks exceed the available budget."
  ],
  "always_do": [
    "preserve a validation floor",
    "tie budget changes to risk or expected value",
    "distinguish optional polish from required verification",
    "make exit or escalation explicit"
  ],
