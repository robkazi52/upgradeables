  "mechanism": "Run POWER only to generate and compare bounded plans, then collapse to one plan and construct a handoff containing locked goals, selected decisions, rejected assumptions, evidence needs, risks, and execution invariants. A supervisor validates the handoff before activating SAFE, which executes only the committed plan with narrow drift and atomic checks. Re-enter POWER only through a checkpoint when execution exposes an architecture-level defect.",
  "procedure": [
    "Declare HYBRID and define separate planning and execution completion criteria.",
    "Use POWER to generate, evaluate, and collapse candidate plans.",
    "Create a transition state with the selected plan, locked constraints, evidence, risks, unresolved items, and retired branches.",
    "Have the supervisor verify that the plan is executable and no speculative assumptions remain active.",
    "Switch explicitly to SAFE and execute with grounding, narrow drift, and atomic validation.",
    "If execution uncovers a design failure, checkpoint state and deliberately return to POWER rather than improvising."
  ],
  "always_do": [
    "declare the active phase",
    "collapse branches before execution",
    "transfer locked state explicitly",
    "gate every POWER-to-SAFE and SAFE-to-POWER transition"
  ],
  "never_do": [
    "execute directly from multiple POWER branches",
    "carry exploratory assumptions into SAFE as facts",
    "silently switch modes mid-action",
    "use HYBRID when one mode suffices"
  ],
  "interaction_reasons": {
    "power-mode": "POWER supplies bounded design and candidate comparison in the first phase.",
    "safe-mode": "SAFE supplies grounded, conservative execution after commitment.",
    "ultimate-suite-supervisor": "The suite supervisor owns phase declaration, conflict resolution, and transition authorization."
  },
  "counterbalance_reasons": {
    "meta-stability": "Meta-Stability can freeze transition state when repeated mode switching threatens coherence."
  },
  "redundancy_reasons": {
    "power-mode": "POWER alone does not define the safe execution transition.",
    "safe-mode": "SAFE alone does not provide broad architectural search."
  },
  "conflict_rules": [
    "No POWER branch may execute until one plan passes collapse and handoff validation.",
    "SAFE findings can reopen design only through a recorded checkpoint.",
    "Truth and safety vetoes survive both modes and cannot be relaxed by transition."
  ],
