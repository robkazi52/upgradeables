  "mechanism_basis": "recovered",
  "mechanism": "Define an adapter contract around the proposed capability, route only an explicit test cohort through it, and preserve the unchanged base as control and rollback. Compare quality, cost, latency, drift, and failure behavior against predeclared acceptance thresholds; promote only the demonstrated stable interface, otherwise revise or retire the adapter without contaminating core rules.",
  "procedure": [
    "State the hypothesis, acceptance metrics, test cohort, and non-negotiable invariants.",
    "Expose the smallest stable interface needed by the capability.",
    "Implement or specify it as a detachable adapter with base-path fallback and isolated state.",
    "Run representative and adversarial trials against the unchanged base.",
    "Compare benefit, regressions, operating cost, and rollback behavior.",
    "Promote the stable behavior only after thresholds pass; otherwise revise or remove the adapter and retain the base."
  ],
  "always_do": [
    "keep the base path available during evaluation",
    "predeclare promotion criteria",
    "isolate experimental state and authority",
    "record promotion or retirement evidence"
  ],
  "never_do": [
    "declare an experiment core because it is novel",
    "let adapter-only assumptions leak into the base",
    "promote on one favorable example",
    "remove rollback before stability is demonstrated"
  ],
  "interaction_reasons": {
    "architect-orchestrator": "The architect defines the adapter boundary and routes the controlled cohort.",
    "future-proof-mode-selector": "A model- or environment-specific capability can remain an adapter selected only where supported."
  },
  "counterbalance_reasons": {
    "meta-stability": "Meta-Stability freezes the base and suppresses experimental activation when coherence is already degrading."
  },
  "redundancy_reasons": {
    "crispr-edit": "CRISPR changes an established component precisely; Adapter-First evaluates an unproven capability without changing that component."
  },
  "conflict_rules": [
    "Security and integrity repairs follow their mandated path rather than waiting for experimental promotion.",
    "If the adapter cannot be isolated from base state or authority, do not trial it in production.",
    "A benefit score cannot override a failed invariant or rollback test."
  ],
