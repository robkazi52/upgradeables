  "mechanism": "Collect evidence from Meta-Awareness, classify it as loop/stale path, localized contradiction, broader state instability, or unverifiable, and activate only the smallest matching repair pack. Preserve locked state, serialize repair ownership so packs do not race, then re-observe the affected process. Meta-Supervisor manages health diagnosis and repair; Ultimate Suite Supervisor remains responsible for global modes, stack enforcement, edit-class selection, and suite conflicts.",
  "procedure": [
    "Request or read an evidence-bearing process-health snapshot.",
    "Classify the failure and identify the smallest responsible state or reasoning region.",
    "Select no action, Stuck-Pattern Reset, Contradiction Micro-Repair, or escalation to Meta-Stability or suite supervision.",
    "Lock facts, constraints, and unaffected modules; assign one repair owner.",
    "Run the bounded repair and request a fresh health observation.",
    "Close on pass, repeat only with new evidence, or escalate when the failure crosses the scaffold boundary."
  ],
  "always_do": [
    "route from observable diagnosis",
    "choose the smallest repair pack",
    "preserve locked state",
    "recheck after repair",
    "escalate suite-wide conflicts"
  ],
  "never_do": [
    "declare global operating modes",
    "rewrite architecture under a health-repair pretext",
    "run competing repair packs on the same region",
    "anthropomorphize process failures"
  ],
