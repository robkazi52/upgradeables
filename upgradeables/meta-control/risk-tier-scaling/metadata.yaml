  "mechanism_basis": "recovered",
  "mechanism": "Classify the whole task and any higher-risk subregions using consequence, uncertainty, reversibility, scope of impact, and evidence quality. Map the result to explicit control floors: light single-path checks for routine work, stronger source and consistency checks for material work, and independent verification, hard vetoes, checkpointing, and fail-closed behavior for high-risk work. Reclassify when new evidence raises or lowers risk.",
  "procedure": [
    "Identify potential harms, affected parties, uncertainty, reversibility, and blast radius.",
    "Assign a risk tier to the task and separately to any exceptional subregion.",
    "Select the tier's mandatory reasoning, evidence, independent-check, and veto controls.",
    "Fund those controls through Cognitive Governor and route depth with DDA.",
    "Reassess risk before irreversible action and whenever new evidence changes consequence or uncertainty.",
    "Commit only when the tier's acceptance gates pass; otherwise abstain, escalate, or narrow the action."
  ],
  "always_do": [
    "assess consequence and uncertainty separately",
    "use the highest applicable tier at mixed-risk boundaries",
    "make tier controls observable",
    "reclassify on new evidence"
  ],
  "never_do": [
    "assign risk from domain label alone",
    "lower a tier to fit budget",
    "average away a safety-critical minority risk",
    "use high rigor everywhere without consequence"
  ],
  "interaction_reasons": {
    "dynamic-depth-allocation": "DDA concentrates extra work on high-tier regions while preserving baseline coverage.",
    "fail-closed-abstention": "High-tier unverifiable results route to abstention instead of forced output.",
    "cognitive-governor": "The governor reserves enough total budget to meet the tier's mandatory floor."
  },
  "counterbalance_reasons": {
    "reasoning-throughput-governor": "Throughput preserves efficiency for low-tier work without weakening high-tier gates."
  },
  "redundancy_reasons": {
    "dynamic-depth-allocation": "Risk Tier sets mandatory rigor; DDA distributes discretionary and required depth among regions.",
    "safe-mode": "SAFE is an execution profile appropriate to consequential work; Risk Tier decides when and how much rigor is required."
  },
  "conflict_rules": [
    "A required tier cannot be lowered because of cost or deadline.",
    "When tier controls cannot be completed, return blocked or abstain.",
    "Mixed-risk tasks use local higher tiers without forcing unrelated routine regions into maximum review."
