  "mechanism_basis": "recovered",
  "mechanism": "Extract the invariant behavior shared by a task family and encode it in the recovered Gene schema: name/version, purpose, scope, triggers, always and avoid rules, reasoning pattern, evidence handling, Core interface, output contract, and compatibility notes. Test activation and non-activation cases, conflict precedence, and behavior with representative Cores; publish the behavior separately from knowledge and loader policy.",
  "procedure": [
    "Collect repeated successful and failed task instances and isolate the stable behavior rather than domain facts.",
    "Define scope, activation conditions, and explicit non-triggers.",
    "Specify always-do, never-do, reasoning pattern, evidence handling, and output contract.",
    "Declare Core, validator, and other-Gene interfaces plus authority and conflict rules.",
    "Test positive activation, false activation, missing-Core, and conflicting-Gene cases.",
    "Version and publish the Gene with provenance and composition notes."
  ],
  "always_do": [
    "keep behavior separate from domain knowledge",
    "make activation and output contracts testable",
    "declare compatibility and precedence",
    "version behavioral changes"
  ],
  "never_do": [
    "turn a Gene into a full OS",
    "copy a domain corpus into behavior instructions",
    "collapse materially distinct task families into one giant Gene",
    "claim hidden behavior outside the loaded module"
  ],
  "interaction_reasons": {
    "domain-core-builder": "The Gene queries or consumes a Core while remaining responsible only for behavior and output shape.",
    "architect-orchestrator": "The architect loads and composes the right Gene for the task.",
    "resonance-gene-builder": "Resonance Gene Builder creates a special coupling Gene when recurring cross-module coordination, not task behavior alone, is the target."
  },
  "counterbalance_reasons": {
    "domain-core-builder": "The Core boundary prevents behavior modules from becoming knowledge dumps."
  },
  "redundancy_reasons": {
    "resonance-gene-builder": "Both emit Genes, but the Resonance builder is limited to stable coupling rules among modules; this builder covers task and writing behaviors generally."
  },
  "conflict_rules": [
    "Global truth, safety, and authorization rules outrank any Gene.",
    "A Gene may query a Core but cannot silently redefine its sourced domain facts.",
    "Conflicting Genes require declared precedence or explicit orchestration rather than blended instructions."
  ],
