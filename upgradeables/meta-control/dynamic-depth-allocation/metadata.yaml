  "mechanism": "Partition the task into meaningful regions, score each on difficulty, uncertainty, consequence, dependency centrality, and current evidence deficit, and assign depth bands under the Cognitive Governor's total envelope. Re-score after discoveries and move effort toward unresolved hotspots while maintaining a minimum pass everywhere. DDA decides where depth goes, not the total budget or execution concurrency.",
  "procedure": [
    "Decompose the task into independently inspectable regions or claims.",
    "Score each region for uncertainty, consequence, coupling, novelty, and evidence deficit.",
    "Reserve a minimum validation pass for all regions.",
    "Allocate the remaining governed budget to high-score regions and choose appropriate methods for each.",
    "Re-score when a local finding changes dependencies or risk.",
    "Stop reallocating when all mandatory regional thresholds pass or escalate if the global budget is insufficient."
  ],
  "always_do": [
    "maintain a minimum pass everywhere",
    "use explicit hotspot signals",
    "reallocate when evidence changes the map",
    "stay within or explicitly renegotiate the global budget"
  ],
  "never_do": [
    "equate length with difficulty",
    "starve low-score regions of mandatory checks",
    "hide budget overruns as local depth",
    "confuse more parallel workers with deeper reasoning"
  ],
  "interaction_reasons": {
