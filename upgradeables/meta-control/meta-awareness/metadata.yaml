  "mechanism": "Maintain a small observable health frame: declared mode, current goal and state version, active modules, progress signal, repeated action signature, unresolved contradictions, and authority conflicts. Compare these observations with expected workflow state at checkpoints and emit pass, fail, repair-required, or unverifiable plus evidence; the pack diagnoses and reports but does not silently reroute or rewrite the task.",
  "procedure": [
    "Read declared mode, locked goal, state version, active modules, and expected next transition.",
    "Collect observable indicators of progress, repetition, contradiction, state staleness, and module conflict.",
    "Compare indicators with thresholds and workflow expectations.",
    "Classify health as pass, fail, repair-required, or unverifiable and attach the triggering evidence.",
    "Send the finding to Meta-Supervisor or the owning workflow without changing authority or inventing internal mental-state explanations."
  ],
  "always_do": [
    "limit claims to observable process state",
    "attach evidence to a health finding",
    "distinguish detection from repair",
    "emit unverifiable when a signal cannot be checked"
  ],
  "never_do": [
    "claim consciousness, identity, hidden intention, or latent state",
    "silently change the active mode",
    "certify health from fluent output alone",
    "diagnose unavailable internal processes"
  ],
