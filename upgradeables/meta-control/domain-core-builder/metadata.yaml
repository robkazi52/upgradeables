  "mechanism_basis": "normalized-from-recovered",
  "mechanism": "Compile sourced domain material into the recovered Core fields: scope, entities and variables, reasoning map, required data, evidence hierarchy, decision logic, failure modes, canonical examples, Gene and validator interfaces, and version provenance. Keep prescriptive behavior in Genes, expose queries and typed outputs rather than dumping the entire Core into every task, and validate both source fidelity and interface sufficiency. The C-00 builder wrapper is a modern normalization of the recovered Core schema.",
  "procedure": [
    "Define domain boundaries, target decisions, and excluded neighboring domains.",
    "Inventory authoritative sources, entities, variables, required data, and uncertainty.",
    "Build reasoning and evidence maps with provenance at the smallest maintainable units.",
    "Encode decision logic, failure modes, and canonical examples without adding behavioral voice rules.",
    "Declare query interfaces for Genes and validation interfaces for truth and citation checks.",
    "Test retrieval sufficiency, source fidelity, conflicting evidence, and version migration; publish with provenance."
  ],
  "always_do": [
    "separate knowledge from behavior",
    "preserve source and version provenance",
    "state required data and evidence hierarchy",
    "declare interfaces rather than assume whole-Core loading"
  ],
  "never_do": [
    "present generated domain inference as sourced knowledge",
    "embed writing style and task behavior into the Core",
    "load the whole Core when a narrow query suffices",
    "claim C-00 is a directly recovered historical ID"
  ],
  "interaction_reasons": {
    "behavior-gene-builder": "Behavior Genes consume Core knowledge through declared interfaces without owning it.",
    "citation-fidelity": "Citation Fidelity validates that Core atoms remain tied to their sources.",
    "scoped-loader": "The loader retrieves only the Core sections relevant to the active task."
  },
  "counterbalance_reasons": {
    "behavior-gene-builder": "The Gene boundary prevents the Core from accumulating behavioral instructions."
  },
  "redundancy_reasons": {
    "stateblock": "StateBlock stores current task state; a Domain Core stores reusable domain knowledge and decision structure."
  },
  "conflict_rules": [
    "Source evidence outranks a convenient decision map.",
    "Conflicting authoritative sources remain represented with scope and uncertainty rather than silently merged.",
    "Genes may select presentation or procedure but may not mutate sourced Core atoms."
  ],
