  "redundancy_reasons": {
    "cognitive-governor": "Budget versus flow: Cognitive Governor decides total effort, RTG controls work rate and work in progress.",
    "dynamic-depth-allocation": "Depth versus scheduling: DDA decides regional inspection depth, RTG decides batching and concurrency."
  },
  "conflict_rules": [
    "Mandatory serial dependencies and vetoes override concurrency goals.",
    "When validation backlog grows, production slows before checks are weakened.",
    "Throughput changes cannot exceed the global reasoning envelope without governor approval."
  ],
