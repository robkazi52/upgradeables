  "mechanism": "Treat planning, generation, evidence acquisition, and validation as a bounded work queue. Set limits on active branches, batch size, and how far unchecked output may accumulate; observe completion rate, rework, validator backlog, and error rate, then add backpressure, reduce breadth, or rebalance stages. RTG governs how work flows under a budget; Cognitive Governor sets total spend and DDA sets depth per region.",
  "procedure": [
    "Map the workflow stages, dependencies, and mandatory serial gates.",
    "Set initial work-in-progress, branch, batch, and unchecked-output limits.",
    "Measure useful completions, latency, rework, error rate, and validator backlog.",
    "Increase concurrency or batch size only where independent work exists and checks keep pace.",
    "Apply backpressure or narrow breadth when validation lags or rework rises.",
    "Stop tuning when throughput meets the task's latency and quality target within the governed budget."
  ],
  "always_do": [
    "measure useful completion rather than raw output volume",
    "keep validation coupled to generation",
    "respect dependency and authority serialization",
    "apply backpressure on rising rework"
  ],
  "never_do": [
    "parallelize dependent decisions",
    "let unchecked output grow without bound",
    "optimize speed by dropping mandatory checks",
    "mistake more tokens or agents for higher throughput"
  ],
  "interaction_reasons": {
    "cognitive-governor": "The Cognitive Governor sets the total cost and time envelope within which RTG schedules work.",
    "dynamic-depth-allocation": "DDA specifies how much depth each region needs; RTG schedules those unequal units efficiently.",
    "parallel-qms": "Parallel-QMS consumes validation capacity that RTG must keep synchronized with candidate production."
  },
  "counterbalance_reasons": {
    "meta-awareness": "Meta-Awareness detects queue loops, stalled progress, and module contention created by aggressive throughput settings."
