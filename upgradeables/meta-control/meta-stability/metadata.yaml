  "mechanism": "On a defined instability signal, freeze optional activations and structural changes, select the latest verified state snapshot, and compare active goals, modules, decisions, and open issues against that checkpoint. Quarantine conflicting deltas, re-establish one authority order and next step, run a coherence check, then resume changes one at a time with observation; MSM stabilizes state, not content by force.",
  "procedure": [
    "Confirm an instability trigger such as state divergence, repeated regression, or unresolved module conflict.",
    "Pause optional changes and capture the current state without overwriting the last verified checkpoint.",
    "Compare goals, decisions, modules, sources, and open issues with the verified snapshot.",
    "Quarantine unverified deltas and resolve authority conflicts explicitly.",
    "Run coherence, state-version, and invariant checks on the restored configuration.",
    "Resume one bounded change at a time and exit MSM only after consecutive stable checkpoints."
  ],
  "always_do": [
    "preserve the last verified checkpoint",
    "freeze optional change before diagnosis",
    "quarantine rather than erase disputed deltas",
    "define exit evidence"
  ],
  "never_do": [
    "call ordinary uncertainty instability",
    "restore an unverified snapshot",
    "silently discard user-approved changes",
    "remain permanently frozen after exit criteria pass"
  ],
