  "mechanism": "Probe real host affordances—context, tools, state persistence, structured outputs, reliability evidence, and execution permissions—then combine them with task risk to choose a named light, standard, or heavy scaffold profile. Use model-size drift scaling as one capability signal, never as the selector itself; capability claims must be observed or declared, and truth, safety, state, and integrity invariants remain mandatory in every profile.",
  "procedure": [
    "Declare the task's risk, state, tool, and validation requirements.",
    "Probe or read the host's actual capabilities and permissions without assuming hidden persistence or tools.",
    "Map capability and risk to a predeclared operating profile with explicit enabled and omitted controls.",
    "Run a readiness check and select a conservative fallback when any required affordance is absent.",
    "Monitor failures that invalidate the profile and switch modes at a checkpoint.",
    "Record the chosen profile and reasons so behavior remains reproducible across hosts."
  ],
  "always_do": [
    "test capabilities rather than infer them from brand or model size",
    "preserve invariant controls across profiles",
    "provide a conservative fallback",
    "record selection rationale"
  ],
  "never_do": [
    "assume a larger model has tools or persistence",
    "remove truth or safety gates as an optimization",
    "silently change modes mid-action",
    "encode one vendor's interface as universal semantics"
  ],
  "interaction_reasons": {
