  "mechanism_basis": "recovered",
  "mechanism": "Fingerprint attempts by goal, assumptions, method, inputs, and failure result rather than wording. When a predeclared repetition threshold is met without new evidence or state change, snapshot locked facts and accepted results, quarantine the failed path and its unsupported assumptions, state the recurring blocker, and restart from a materially different method or escalate. Only the failed reasoning path resets.",
  "procedure": [
    "Record each attempt's goal, method, key assumptions, state version, and observed failure.",
    "Compare the new attempt with prior fingerprints and test whether evidence, inputs, or method materially changed.",
    "On repeated failure, freeze locked facts, constraints, accepted outputs, and unresolved evidence.",
    "Quarantine the failed path and name the blocker it could not overcome.",
    "Choose a different hypothesis, tool, decomposition, or escalation route with a new success test.",
    "Run one bounded attempt and recheck; escalate if the same blocker persists."
  ],
  "always_do": [
    "detect semantic repetition rather than repeated wording",
    "preserve trusted state",
    "make the replacement path materially different",
    "set a bounded retry limit"
  ],
  "never_do": [
    "reset facts or user constraints",
    "call normal iteration stuckness",
    "retry with cosmetic prompt changes",
    "erase failure evidence that should inform the next path"
  ],
  "interaction_reasons": {
    "bounded-exit": "Bounded ExIt supplies the threshold for stopping low-value repeated passes.",
    "stateblock": "StateBlock preserves the trustworthy context before the path is reset.",
    "meta-supervisor": "Meta-Supervisor validates the stuck diagnosis and routes the reset."
  },
  "counterbalance_reasons": {
    "forethought-checkpoints": "Forethought prevents the alternative restart from repeating the same costly commitment without a new prerequisite."
  },
  "redundancy_reasons": {
    "meta-stability": "Reset isolates one failed path; Meta-Stability reconciles broader state and module instability.",
    "anti-tunnel-vision": "Anti-Tunnel prevents early fixation; Stuck Reset acts after repetition proves fixation persistent."
  },
  "conflict_rules": [
    "Locked facts and constraints survive the reset.",
    "If every materially distinct path shares the same external blocker, escalate rather than keep resetting.",
    "A destructive alternative requires its own pre-commit authorization."
  ],
