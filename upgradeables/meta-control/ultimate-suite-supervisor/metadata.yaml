  "mechanism_basis": "recovered",
  "mechanism": "Build a suite execution contract that declares active mode, required Core and Gene stack, authorized modules, authority precedence, edit class, duration and intensity, transition rules, and final health criteria. Delegate local process monitoring and repair to Meta-Supervisor, but retain decisions that affect the whole suite: POWER/SAFE/HYBRID, required stack enforcement, CRISPR versus Surgery, cross-pack conflicts, and post-output acceptance. Emit one authoritative routing state and fail closed on unresolved global conflict.",
  "procedure": [
    "Load the suite manifest, task, host capabilities, risk, and authority rules.",
    "Declare the active operating mode and required Core, Gene, Upgradeable, state, and validation stack.",
    "Resolve activation conflicts and select local CRISPR or global Surgery editing when changes arise.",
    "Set duration, intensity, transition gates, and one owner for each component result.",
    "Delegate process-health monitoring and bounded repairs to Meta-Supervisor while retaining global authority decisions.",
    "Run post-output checks for grounding, contradiction, tone, drift, stack compliance, and unresolved conflicts; commit or fail closed."
  ],
  "always_do": [
    "declare mode explicitly",
    "enforce the required Core stack",
    "resolve authority before activation",
    "choose edit scale explicitly",
    "own the final suite health decision"
  ],
  "never_do": [
    "activate the full suite by default",
    "duplicate Meta-Supervisor's local repair work",
    "allow two packs authority over the same decision",
    "approve output with unresolved global conflict"
  ],
  "interaction_reasons": {
