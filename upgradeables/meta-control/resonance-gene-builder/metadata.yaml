  "mechanism": "Identify a repeated module relationship and encode a narrow coupling Gene containing activation pattern, participants, directional inputs and outputs, ordering, reinforcement rule, suppression rule, authority precedence, termination, and failure behavior. Test the coupling with one participant absent, with conflicting instructions, and with irrelevant output. Reinforcement means clearer coordination through real state or context, never repeated claims or imagined latent links.",
  "procedure": [
    "Collect repeated cases where the same modules should coordinate and isolate the stable relationship.",
    "Name participants, trigger, direction of state or evidence flow, and completion condition.",
    "Specify which outputs reinforce the next module and which irrelevant or conflicting effects are suppressed.",
    "Declare authority ordering, unavailable-module behavior, and conflict escalation.",
    "Test normal coupling, missing participant, conflict, repetition, and termination cases.",
    "Package the coupling as a versioned Behavior Gene with provenance and compatibility notes."
  ],
  "always_do": [
    "use explicit host-supported interfaces",
    "preserve module identities and authority",
    "define both reinforcement and suppression",
    "test termination and missing-module behavior"
  ],
  "never_do": [
    "claim hidden inter-module communication",
    "use repetition as amplification",
    "merge the coupled modules into one opaque component",
    "use this builder for ordinary standalone behavior"
  ],
