  "mechanism": "Lock the committed goal, sources, state version, authorized action, and acceptance criteria; narrow allowable drift to the requested execution delta. Before each consequential step verify its atomic prerequisites and authority, perform only that step, inspect the observable result, and stop on mismatch or missing evidence. SAFE does not mean low capability: it uses deep checks where risk demands, but it forbids speculative expansion during execution.",
  "procedure": [
    "Declare SAFE and load the committed plan, authoritative state, permitted delta, and risk controls.",
    "Verify prerequisites, permissions, evidence, and rollback before each consequential boundary.",
    "Execute the smallest authorized action without reopening design alternatives.",
    "Validate the immediate state change and protected invariants atomically.",
    "Continue only on pass; otherwise stop, repair locally, or checkpoint for a supervised return to POWER.",
    "Finalize conservatively with unresolved uncertainty and evidence limits visible."
  ],
