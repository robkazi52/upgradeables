  "mechanism": "Traverse the image in a declared order, transcribe only visible characters, and reconstruct headings, rows, columns, or spatial groups only where visible evidence supports them. Unreadable regions receive explicit illegible/uncertain markers linked to their location; context is never used to silently complete missing text.",
  "procedure": [
    "Record the image/page identifier and reading order.",
    "Segment visible text and structural regions.",
    "Transcribe characters exactly, preserving capitalization, numbers, and punctuation where legible.",
    "Represent visible layout without inferring hidden cells or labels.",
    "Mark obscured or ambiguous regions with location-specific uncertainty.",
    "Run a second pass against the image and finalize only verified capture."
  ],
  "always_do": [
    "Preserve visible spelling, numbers, labels, and structure.",
    "Mark uncertainty at the exact region.",
    "Keep the ITFC acronym collision explicit in provenance."
  ],
