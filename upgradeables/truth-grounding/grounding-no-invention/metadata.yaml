  "mechanism": "Maintain a boundary between source-supported atoms and model-generated interpretation. Each material factual claim must resolve to supplied data or verified external evidence; missing fields remain missing, and permissible inference is labeled instead of being written back as source fact.",
  "procedure": [
    "Declare the allowed evidence boundary.",
    "Extract material source-supported facts without filling absent fields.",
    "Separate facts from interpretations and hypotheses.",
    "For each candidate factual claim, locate supporting evidence inside the boundary.",
    "Label, narrow, omit, or fail closed on unsupported claims.",
    "Recheck that repair or style changes did not introduce new facts."
  ],
  "always_do": [
    "Mark material uncertainty and undocumented fields.",
    "Keep factual claims traceable to evidence.",
    "Return the supported subset when full closure is impossible."
  ],
  "never_do": [
    "Invent a source, quotation, measurement, policy, patient detail, or tool result.",
    "Convert a likely value into a documented value.",
    "Let a validator manufacture facts to make an answer pass."
  ],
  "interaction_reasons": {
    "citation-fidelity": "Citation Fidelity verifies the finer claim-to-citation support relationship inside the broader grounding boundary.",
    "fail-closed-abstention": "Provides the terminal behavior when essential support is absent.",
    "epistemic-status-gating": "Labels permitted inference so it is not confused with source fact."
  },
  "counterbalance_reasons": {
