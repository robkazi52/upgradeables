  "mechanism_basis": "recovered",
  "mechanism": "Tag each proposition by semantic phase and keep hypothetical premises, derived consequences, and branch-local assumptions in a separate compartment. Any transfer from a hypothetical branch into factual state requires independent factual support; otherwise the proposition remains labeled hypothetical or is excluded from the factual output.",
  "procedure": [
    "Declare the factual baseline and the allowed counterfactual question.",
    "Tag introduced premises as hypothetical and retain their branch identity.",
    "Derive consequences only inside that branch.",
    "Check the draft for branch-local material presented without a hypothesis label.",
    "Move a proposition into factual state only when independent evidence supports it.",
    "Return factual findings and counterfactual results in visibly separate output regions."
  ],
  "always_do": [
    "Preserve the original factual baseline.",
    "Label hypothetical assumptions and consequences.",
    "Require evidence for any transition from hypothetical to factual status."
  ],
  "never_do": [
    "Treat a simulated outcome as observed evidence.",
    "Let hypothetical details update canonical factual state.",
    "Erase uncertainty merely because a counterfactual narrative is coherent."
  ],
  "interaction_reasons": {
    "domain-mode-isolation": "Provides separate state compartments for factual and hypothetical modes.",
    "controlled-drift-corridors": "Defines how much interpretive movement is permitted inside the hypothetical branch.",
    "epistemic-status-gating": "Supplies proposition-level fact/inference/hypothesis labels used by the gate."
  },
  "counterbalance_reasons": {
    "grounding-no-invention": "Grounding prevents the exploratory branch from being mistaken for evidence."
  },
  "redundancy_reasons": {
    "counterfactual-silence-scaffold": "Silence suppresses unauthorized counterfactual content entirely; integrity allows authorized counterfactuals but isolates and labels them."
  },
  "conflict_rules": [
    "A factual-only task boundary overrides permission to explore counterfactuals.",
    "A stylistic request to write hypotheticals as certain cannot override phase labels."
  ],
