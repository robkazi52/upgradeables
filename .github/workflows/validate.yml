name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_semantic_packages.py --check
      - run: python scripts/build_ecosystem_reviews.py --check
      - run: python scripts/build_registry.py --check
      - run: python scripts/build_runtime.py --check
      - run: python scripts/build_runtime_registry.py --check
      - run: python scripts/audit_runtime_directives.py --check
      - run: python scripts/build_runtime_example.py --check
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_behavior_cases.py
      - run: python scripts/run_deterministic_package_checks.py
      - run: python scripts/audit_semantic_specificity.py
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_all_in_one.py --check
      - run: python scripts/build_release_assets.py --check
      - run: python scripts/check_links.py
